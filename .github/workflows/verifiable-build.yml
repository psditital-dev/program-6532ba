name: Verifiable build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Install solana-verify
        run: cargo install solana-verify --version 0.5.2 --locked
      - name: Build in the verifiable-build image
        run: solana-verify build --library-name prisma_split
      - name: Executable hash
        # the build container writes target/ as root: copy the output out before adding files next to it
        run: |
          mkdir -p out
          cp target/deploy/prisma_split.so out/
          solana-verify get-executable-hash out/prisma_split.so | tee out/prisma_split.hash
      - uses: actions/upload-artifact@v4
        with:
          name: prisma_split-program
          path: out/
